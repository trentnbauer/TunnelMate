services:
  tunnel:
    build: .
    restart: unless-stopped
    environment:
      # Cloudflare account settings
      CLOUDFLARE_API_TOKEN: changeme
      CLOUDFLARE_ACCOUNT_ID: changeme
      NAME: Tunnel # Recommend naming the same as the app / purpose

      # Hostname 1: fully public, no Cloudflare Access (no USERS_1 set)
      HOSTNAME_1: whoami.example.com
      SERVICE_1: http://whoami:80

      # Hostname 2: same app, but /admin is locked down to just these emails.
      # No SERVICE_2 -- this reuses HOSTNAME_1's route, it just adds an
      # Access policy scoped to that path.
      HOSTNAME_2: whoami.example.com/admin
      USERS_2: you@example.com,teammate@example.com

      # Add more hostnames by continuing the sequence with no gaps, e.g.:
      # HOSTNAME_3: another.example.com
      # SERVICE_3: http://another:8080
      # USERS_3: you@example.com   # omit USERS_N to leave it public
    volumes:
      - tunnel-data:/data
    depends_on:
      - whoami

  # Example app exposed through the tunnel -- replace with your own services
  # and point SERVICE_N at them using their compose service name.
  whoami:
    image: traefik/whoami:latest
    restart: unless-stopped

volumes:
  tunnel-data:
